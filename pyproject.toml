[project]
name = "korea-real-estate-mlops"
version = "0.1.0"
description = "Leakage-free MLOps pipeline predicting realized resale price of Korean pre-sale rights (분양권) — GCP-native (BigQuery + Vertex AI)"
requires-python = ">=3.11"
dependencies = [
    # ingestion
    "httpx>=0.28",
    "requests>=2.32",
    "tenacity>=9.0",
    "chardet>=5.2",
    "lxml>=5.3",
    "xmltodict>=0.14",
    "pypdf>=5.1",             # 입주자모집공고문 PDF text extraction
    "pdfplumber>=0.11",       # ruled-table extraction (규제 summary box / 공급금액)
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.2",   # loads gov-API keys from .env (GCP creds use ADC)
    # storage / warehouse (BigQuery is the data<->ML contract boundary)
    "pyarrow>=18.0",
    "gcsfs>=2024.10",              # read/write parquet to gs:// URIs
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.3",             # BigQuery -> pandas dtype support
    # features / model (LightGBM + XGBoost + scikit-learn all in scope)
    "pandas>=2.2",
    "numpy>=2.1",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "optuna>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ipykernel",
]

# ML orchestration deps (Vertex AI Pipelines / Kubeflow SDK). Installed in the
# Vertex build context and for local pipeline compilation; kept out of the
# default sync so the test env stays light. Mirrors ml_pipeline/requirements.txt.
#   uv sync --group ml
ml = [
    "kfp>=2.9",
    "google-cloud-aiplatform>=1.70",
]

# Airflow runs in its own container (Astro / docker). Kept out of the default
# sync so the local venv resolves cleanly. Mirrors data_pipeline/requirements.txt.
#   uv sync --group airflow
airflow = [
    "apache-airflow>=2.10",
    "apache-airflow-providers-google>=10.24",  # GCS + BigQuery operators/hooks
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline", "ml_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"
# notebooks/ is EDA sandbox only (see repo_instruction.md) — not linted / CI-ignored
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["data_pipeline/tests", "ml_pipeline/tests"]
pythonpath = ["."]
