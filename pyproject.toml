[project]
name = "presale-pipeline"
version = "0.1.0"
description = "Leakage-free ML pipeline predicting realized resale price of Korean pre-sale rights (분양권) for Seoul + Gyeonggi"
requires-python = ">=3.11"
dependencies = [
    # ingestion
    "httpx>=0.28",
    "requests>=2.32",
    "tenacity>=9.0",
    "chardet>=5.2",
    "lxml>=5.3",
    "xmltodict>=0.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    # storage
    "duckdb>=1.1",
    "pyarrow>=18.0",
    # features / model
    "pandas>=2.2",
    "numpy>=2.1",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "optuna>=4.1",
    # tracking
    "mlflow>=2.18",
    # serving
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ipykernel",
]

# Airflow runs in its own docker container (see docker-compose.yml). Kept out of
# the default sync so the local venv resolves cleanly; install with:
#   uv sync --group airflow
airflow = [
    "apache-airflow>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/presale"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
