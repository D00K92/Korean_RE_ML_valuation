# Non-secret tunables. Secrets come from environment (.env) only.
# Loaded by src/presale/config.py. Region is a config value — never hardcoded.

region:
  name: "seoul_gyeonggi"
  # Region is prefix-selected from the bundled 법정동 시군구 table
  # (data/reference/lawd_codes.csv, 구-level for divided cities). To expand
  # nationwide, just add 시도 prefixes here — no hardcoded code lists.
  sido_prefixes: ["11", "41"]      # 11=서울특별시, 41=경기도
  reference_file: "data/reference/lawd_codes.csv"
  # Scope = 수도권 core: all Seoul + Gyeonggi EXCEPT far exurbs weakly linked to
  # the Seoul market. Remove entries here to widen toward full Gyeonggi.
  exclude_codes:
    - "41220"  # 평택시
    - "41250"  # 동두천시
    - "41500"  # 이천시
    - "41550"  # 안성시
    - "41650"  # 포천시
    - "41670"  # 여주시
    - "41800"  # 연천군
    - "41820"  # 가평군
    - "41830"  # 양평군
    # merged codes that return NO MOLIT data — replaced by 구-level codes below
    - "41190"  # 부천시 (data under 41192/41194/41196)
    - "41590"  # 화성시 (data under 41591/41593/41595/41597)
  # 구-level codes MOLIT actually keys 부천/화성 data under (not in the reference
  # table): 부천 abolished its 구 in 2016 but MOLIT kept the old codes; 화성 became
  # a 특례시 in 2025 and MOLIT migrated its data to new 구 codes.
  include_codes:
    - "41192"  # 부천 원미(중·상동)
    - "41194"  # 부천 소사(소사본동)
    - "41196"  # 부천 오정(원종동)
    - "41591"  # 화성 남양·향남
    - "41593"  # 화성 봉담
    - "41595"  # 화성 병점·진안
    - "41597"  # 화성 동탄(여울·영천동)
  # Optional explicit override; when non-empty it wins over sido_prefixes.
  lawd_codes: []

label:
  # Pooled 분양권 + 입주권 전매 실거래가 (both from the one SilvTrade feed),
  # per m² resale price. right_type (ownershipGbn) is kept as a feature.
  source: "molit_presale_resale"   # getRTMSDataSvcSilvTrade — 분양권 + 입주권 pooled
  unit: "krw_per_m2"
  right_types: ["분양권", "입주권"]  # ownershipGbn: empty=분양권, '입'=입주권
  exclude_cancelled: true          # drop rows with cdealType set (해제 거래)
  # Day-1 volume fallback: if pooled resale volume is too thin, add apartment 매매.
  fallback_source: "molit_apartment_trade"

ingest:
  start_ym: "201601"               # backfill 2016 -> present (pre-전매제한 boom era)
  reporting_lag_days: 30           # comp usable only if deal_date + lag <= prediction_date
  trailing_refresh_months: 2       # always re-fetch the last N months (late-reported deals)
  rate_limit_qps: 2
  max_retries: 5
  retry_backoff_seconds: 2

# API endpoints + params. Secrets (service keys) come from .env, never here.
# Verified against live docs 2026-07-28. Fields marked "# TODO verify" need the
# logged-in data.go.kr Swagger to lock exact names.
sources:

  # -- MOLIT 분양권전매 실거래가 -- training label + features (XML, EUC-KR) --
  molit:
    role: "label"                  # 거래금액 / 전용면적 = KRW per m²
    gateway: "apis.data.go.kr"     # classic feed; wants the ENCODED service key
    key_env: "MOLIT_API_KEY"
    format: "xml"                  # chardet auto-detect (EUC-KR vs UTF-8)
    encoding_autodetect: true
    base_url: "https://apis.data.go.kr/1613000/RTMSDataSvcSilvTrade"
    operation: "getRTMSDataSvcSilvTrade"   # 아파트 분양권·입주권 전매 신고 자료
    key_is_encoded: false          # env holds the DECODED key; pass via params= (verified live)
    request_params:                # loop over LAWD_CD x DEAL_YMD
      lawd_cd: "LAWD_CD"           # 5-digit 시군구 (from region.lawd_codes)
      deal_ymd: "DEAL_YMD"         # YYYYMM
      page_no: "pageNo"
      num_of_rows: "numOfRows"     # set 1000 -> label region-months are always 1 page
    # NOTE (verified live 2026-07-28): this endpoint returns BOTH 분양권 and 입주권
    # transfers, with ENGLISH keys, EUC-KR XML. `ownershipGbn`: '입'=입주권,
    # empty/None=분양권. Rows with `cdealType` set are 해제(cancelled) — exclude from label.
    response_fields:               # per-row (real API keys, verified live)
      complex_name: "aptNm"
      exclusive_area_m2: "excluUseAr"   # m², floored to 2 d.p. on ingest
      floor: "floor"
      price: "dealAmount"               # kept in 만원 (sector standard), comma-formatted string
      deal_year: "dealYear"
      deal_month: "dealMonth"
      deal_day: "dealDay"
      dong: "umdNm"
      jibun: "jibun"
      sigungu_code: "sggCd"
      sigungu_name: "sggNm"
      right_type: "ownershipGbn"        # '입'=입주권 / empty=분양권
      deal_channel: "dealingGbn"        # 중개거래 / 직거래
      cancel_type: "cdealType"          # set => 해제 거래, exclude from label
      cancel_date: "cdealDay"
    fallback:                      # Day-1 volume fallback -> apartment 매매
      base_url: "https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade"
      operation: "getRTMSDataSvcAptTrade"

  # -- ECOS (Bank of Korea) -- monthly macro features --
  ecos:
    role: "macro"
    key_env: "ECOS_API_KEY"
    format: "json"
    # path API: StatisticSearch/{KEY}/{format}/kr/{start}/{end}/{STAT}/{cycle}/{s}/{e}/{item}
    base_url: "https://ecos.bok.or.kr/api/StatisticSearch"
    cycle: "M"                     # monthly
    series:                        # STAT_CODE / ITEM_CODE — verified live 2026-07-28
      base_rate:     { stat_code: "722Y001", item_code: "0101000",   unit: "연%",   desc: "한국은행 기준금리" }
      mortgage_rate: { stat_code: "121Y006", item_code: "BECBLA0302", unit: "연리%", desc: "예금은행 주택담보대출금리(신규취급액)" }
      m2:            { stat_code: "161Y006", item_code: "BBHA00",     unit: "십억원", desc: "M2(평잔, 원계열)" }
      sentiment_csi: { stat_code: "511Y002", item_code: "FME",       unit: "지수",   desc: "소비자심리지수(CCSI)" }

  # -- VWorld Geocoder 2.0 -- complex address -> lat/lon (geocode once, cache) --
  geocode:
    role: "spatial"
    provider: "vworld"             # or "kakao" — only one key needed
    key_env: "VWORLD_API_KEY"
    base_url: "https://api.vworld.kr/req/address"
    request_params:
      service: "address"
      request: "getCoord"          # address -> coordinates
      version: "2.0"
      crs: "EPSG:4326"             # WGS84 lon/lat
      format: "json"
      refine: "true"
      simple: "false"
    address_type_order: ["PARCEL", "ROAD"]   # try 지번 first, fall back to 도로명
    response_fields:
      status: "response.status"    # "OK" | "NOT_FOUND" | "ERROR"
      lon: "response.result.point.x"
      lat: "response.result.point.y"
    kakao_fallback:                # alternative provider if using Kakao Local
      key_env: "KAKAO_REST_API_KEY"
      base_url: "https://dapi.kakao.com/v2/local/search/address.json"
      auth_header: "Authorization: KakaoAK {key}"
    # subway station coords are a STATIC file downloaded once, not a live API
    station_coords_file: "data/reference/subway_stations.csv"

  # -- Applyhome (청약홈 분양정보) -- INFERENCE LIST ONLY, never trained on --
  applyhome:
    role: "inference"              # invariant #3 — must not enter training
    gateway: "api.odcloud.kr"      # odcloud; wants the DECODED service key
    key_env: "APPLYHOME_API_KEY"
    format: "json"
    base_url: "https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1"
    operations:
      apt_detail: "getAPTLttotPblancDetail"   # announcement-level
      apt_model:  "getAPTLttotPblancMdl"       # per 주택형 -> 분양가 + 전용면적
      # other housing types (not primary scope):
      officetel_detail: "getUrbtyOfctlLttotPblancDetail"
      remainder_detail: "getRemndrLttotPblancDetail"
    request_params:
      page: "page"
      per_page: "perPage"          # max 1000
      # cond[...] filters (region / date) applied per pull
    join_key: "PBLANC_NO"          # detail <-> model join
    detail_fields:                 # verified
      announce_no: "PBLANC_NO"
      house_name: "HOUSE_NM"
      supply_region: "SUBSCRPT_AREA_CODE_NM"
      house_kind: "HOUSE_SECD_NM"
      total_units: "TOT_SUPLY_HSHLDCO"
      notice_date: "RCRIT_PBLANC_DE"
      receipt_begin: "RCEPT_BGNDE"
      receipt_end: "RCEPT_ENDDE"
      winner_announce: "PRZWNER_PRESNATN_DE"
    model_fields:                  # TODO verify names in data.go.kr Swagger
      house_type: "HOUSE_TY"          # 주택형
      exclusive_area_m2: "SUPLY_AR"   # 공급/전용면적 — TODO verify
      supply_price: "LTTOT_TOP_AMOUNT"  # 분양가/공급금액 — TODO verify
      units: "SUPLY_HSHLDCO"          # TODO verify
      move_in_ym: "MVN_PREARNGE_YM"   # 입주예정월 — TODO verify

  # -- NEIS 학교기본정보 -- school locations for 학군/amenity features --
  neis:
    role: "amenity"                # static reference; geocoded then -> spatial features
    key_env: "NEIS_API_KEY"
    format: "json"
    base_url: "https://open.neis.go.kr/hub/schoolInfo"
    office_codes: ["B10", "J10"]   # B10=서울특별시교육청, J10=경기도교육청
    page_size: 1000               # NEIS max pSize
    # NEIS gives 도로명주소 only (no lat/lon) -> geocode ORG_RDNMA via VWorld (ROAD)
    response_fields:
      school_code: "SD_SCHUL_CODE"
      name: "SCHUL_NM"
      school_type: "SCHUL_KND_SC_NM"   # 초등학교 / 중학교 / 고등학교 / ...
      foundation: "FOND_SC_NM"         # 공립 / 사립
      office: "ATPT_OFCDC_SC_NM"
      sido: "LCTN_SC_NM"
      road_address: "ORG_RDNMA"
      road_address_detail: "ORG_RDNDA"
      coedu: "COEDU_SC_NM"

features:
  comp_radii_m: [500, 1000, 3000]
  comp_windows_days: [30, 60, 90]
  # dynamic radius expansion for sparse areas: 500m -> 1km -> 3km -> district
  dynamic_radius_expansion: true
  min_comps: 3
  macro_rate_delta_months: 6

split:
  # time-based only — never random shuffle
  val_fraction: 0.15
  test_fraction: 0.15

paths:
  data_root: "data"
  raw_dir: "data/raw"              # Hive-partitioned Parquet (year-month, region)
  feature_dir: "data/features"
  duckdb_path: "data/presale.duckdb"

mlflow:
  experiment_name: "presale_resale_price"
  registered_model_name: "presale_lgbm"
