# Non-secret tunables. Secrets come from environment (.env) only.
# Loaded by data_pipeline/config.py + ml_pipeline/config.py. Region is a config value — never hardcoded.

region:
  name: "all_metro_cities_plus_gyeonggi"
  # Region is prefix-selected from the bundled 법정동 시군구 table
  # (data/reference/lawd_codes.csv, now nationwide). To expand further, just add
  # 시도 prefixes here — no hardcoded code lists. Scope = every 특별/광역/특별자치시
  # (서울·부산·대구·인천·광주·대전·울산·세종) + 경기도.
  sido_prefixes: ["11", "41", "28", "26", "27", "30", "29", "31", "36", "50"]
  reference_file: "data/reference/lawd_codes.csv"
  # Scope = 수도권 core: all Seoul + Gyeonggi EXCEPT far exurbs weakly linked to
  # the Seoul market. Remove entries here to widen toward full Gyeonggi.
  exclude_codes:
    - "41220"  # 평택시
    - "41250"  # 동두천시
    - "41500"  # 이천시
    - "41550"  # 안성시
    - "41650"  # 포천시
    - "41670"  # 여주시
    - "41800"  # 연천군
    - "41820"  # 가평군
    - "41830"  # 양평군
    - "28710"  # 인천 강화군 (rural island — disconnected from the metro)
    - "28720"  # 인천 옹진군 (rural islands)
    # 경기 divided-city PARENT 시 codes — empty in MOLIT (data is under their 구 below).
    # (Busan/Incheon are 광역시, their 자치구 have no parent 시, so no analog needed.)
    - "41110"  # 수원시 (data under 41111/41113/41115/41117)
    - "41130"  # 성남시 (data under 41131/41133/41135)
    - "41170"  # 안양시 (data under 41171/41173)
    - "41270"  # 안산시 (data under 41271/41273)
    - "41280"  # 고양시 (data under 41281/41285/41287)
    - "41460"  # 용인시 (data under 41461/41463/41465)
    # merged codes that return NO MOLIT data — replaced by 구-level codes below
    - "41190"  # 부천시 (data under 41192/41194/41196)
    - "41590"  # 화성시 (data under 41591/41593/41595/41597)
  # 구-level codes MOLIT actually keys 부천/화성 data under (not in the reference
  # table): 부천 abolished its 구 in 2016 but MOLIT kept the old codes; 화성 became
  # a 특례시 in 2025 and MOLIT migrated its data to new 구 codes.
  include_codes:
    - "41192"  # 부천 원미(중·상동)
    - "41194"  # 부천 소사(소사본동)
    - "41196"  # 부천 오정(원종동)
    - "41591"  # 화성 남양·향남
    - "41593"  # 화성 봉담
    - "41595"  # 화성 병점·진안
    - "41597"  # 화성 동탄(여울·영천동)
  # Optional explicit override; when non-empty it wins over sido_prefixes.
  lawd_codes: []

label:
  # Pooled 분양권 + 입주권 전매 실거래가 (both from the one SilvTrade feed),
  # per m² resale price. right_type (ownershipGbn) is kept as a feature.
  source: "molit_presale_resale"   # getRTMSDataSvcSilvTrade — 분양권 + 입주권 pooled
  unit: "krw_per_m2"
  right_types: ["분양권", "입주권"]  # ownershipGbn: empty=분양권, '입'=입주권
  exclude_cancelled: true          # drop rows with cdealType set (해제 거래)
  # Day-1 volume fallback: if pooled resale volume is too thin, add apartment 매매.
  fallback_source: "molit_apartment_trade"

ingest:
  start_ym: "201601"               # backfill 2016 -> present (pre-전매제한 boom era)
  reporting_lag_days: 30           # comp usable only if deal_date + lag <= prediction_date
  trailing_refresh_months: 3       # always re-fetch the last N months (late reports + 해제)
  rate_limit_qps: 2
  max_retries: 5

# Daily incremental refresh (real-time freshness) — see docs/daily_incremental_job.md.
# The daily Airflow DAG re-fetches the trailing window for each feed (full-month
# replace = reconciles late reports, 해제, 등기) and maintains an append-only
# "first-seen" ledger for leakage-exact point-in-time reconstruction.
realtime:
  feeds: ["label", "comps"]        # 분양권 (SilvTrade) + 아파트 매매 (AptTrade)
  ledger_dir: "data/realtime/seen_ledger"   # append-only per-feed first-seen ledger
  delta_dir: "data/realtime/deltas"         # per-run audit summary (new/cancelled/등기)
  retry_backoff_seconds: 2

# API endpoints + params. Secrets (service keys) come from .env, never here.
# Verified against live docs 2026-07-28. Fields marked "# TODO verify" need the
# logged-in data.go.kr Swagger to lock exact names.
sources:

  # -- MOLIT 분양권전매 실거래가 -- training label + features (XML, EUC-KR) --
  molit:
    role: "label"                  # 거래금액 / 전용면적 = KRW per m²
    gateway: "apis.data.go.kr"     # classic feed; wants the ENCODED service key
    key_env: "MOLIT_API_KEY"
    format: "xml"                  # chardet auto-detect (EUC-KR vs UTF-8)
    encoding_autodetect: true
    base_url: "https://apis.data.go.kr/1613000/RTMSDataSvcSilvTrade"
    operation: "getRTMSDataSvcSilvTrade"   # 아파트 분양권·입주권 전매 신고 자료
    key_is_encoded: false          # env holds the DECODED key; pass via params= (verified live)
    request_params:                # loop over LAWD_CD x DEAL_YMD
      lawd_cd: "LAWD_CD"           # 5-digit 시군구 (from region.lawd_codes)
      deal_ymd: "DEAL_YMD"         # YYYYMM
      page_no: "pageNo"
      num_of_rows: "numOfRows"     # set 1000 -> label region-months are always 1 page
    # NOTE (verified live 2026-07-28): this endpoint returns BOTH 분양권 and 입주권
    # transfers, with ENGLISH keys, EUC-KR XML. `ownershipGbn`: '입'=입주권,
    # empty/None=분양권. Rows with `cdealType` set are 해제(cancelled) — exclude from label.
    response_fields:               # per-row (real API keys, verified live)
      complex_name: "aptNm"
      exclusive_area_m2: "excluUseAr"   # m², floored to 2 d.p. on ingest
      floor: "floor"
      price: "dealAmount"               # kept in 만원 (sector standard), comma-formatted string
      deal_year: "dealYear"
      deal_month: "dealMonth"
      deal_day: "dealDay"
      dong: "umdNm"
      jibun: "jibun"
      sigungu_code: "sggCd"
      sigungu_name: "sggNm"
      right_type: "ownershipGbn"        # '입'=입주권 / empty=분양권
      deal_channel: "dealingGbn"        # 중개거래 / 직거래
      cancel_type: "cdealType"          # set => 해제 거래, exclude from label
      cancel_date: "cdealDay"
    fallback:                      # Day-1 volume fallback -> apartment 매매
      base_url: "https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade"
      operation: "getRTMSDataSvcAptTrade"

  # -- ECOS (Bank of Korea) -- monthly macro features --
  ecos:
    role: "macro"
    key_env: "ECOS_API_KEY"
    format: "json"
    # path API: StatisticSearch/{KEY}/{format}/kr/{start}/{end}/{STAT}/{cycle}/{s}/{e}/{item}
    base_url: "https://ecos.bok.or.kr/api/StatisticSearch"
    cycle: "M"                     # monthly
    series:                        # STAT_CODE / ITEM_CODE — verified live (see docs/ecos_interest_rates.md)
      base_rate:       { stat_code: "722Y001", item_code: "0101000",    unit: "연%",   desc: "한국은행 기준금리" }
      loan_rate_avg:   { stat_code: "121Y006", item_code: "BECBLA01",   unit: "연%",   desc: "예금은행 대출평균 가중평균금리(신규취급액)" }
      mortgage_rate:   { stat_code: "121Y006", item_code: "BECBLA0302", unit: "연리%", desc: "예금은행 주택담보대출금리(신규취급액)" }
      mortgage_fixed:  { stat_code: "121Y006", item_code: "BECBLA030201", unit: "연리%", desc: "고정형 주택담보대출금리(신규취급액)" }
      mortgage_var:    { stat_code: "121Y006", item_code: "BECBLA030202", unit: "연리%", desc: "변동형 주택담보대출금리(신규취급액)" }
      group_loan_rate: { stat_code: "121Y006", item_code: "BECBLA03052", unit: "연리%", desc: "집단대출금리(중도금·이주비, 신규취급액)" }
      jeonse_loan_rate: { stat_code: "121Y006", item_code: "BECBLA03041", unit: "연리%", desc: "전세자금대출금리(신규취급액)" }
      m2:              { stat_code: "161Y006", item_code: "BBHA00",     unit: "십억원", desc: "M2(평잔, 원계열)" }
      sentiment_csi:   { stat_code: "511Y002", item_code: "FME",       unit: "지수",   desc: "소비자심리지수(CCSI)" }

  # -- VWorld Geocoder 2.0 -- complex address -> lat/lon (geocode once, cache) --
  geocode:
    role: "spatial"
    provider: "vworld"             # or "kakao" — only one key needed
    key_env: "VWORLD_API_KEY"
    base_url: "https://api.vworld.kr/req/address"
    request_params:
      service: "address"
      request: "getCoord"          # address -> coordinates
      version: "2.0"
      crs: "EPSG:4326"             # WGS84 lon/lat
      format: "json"
      refine: "true"
      simple: "false"
    address_type_order: ["PARCEL", "ROAD"]   # try 지번 first, fall back to 도로명
    response_fields:
      status: "response.status"    # "OK" | "NOT_FOUND" | "ERROR"
      lon: "response.result.point.x"
      lat: "response.result.point.y"
    kakao_fallback:                # keyword search for named complexes (block-code rows)
      key_env: "KAKAO_REST_API_KEY"
      base_url: "https://dapi.kakao.com/v2/local/search/address.json"
      keyword_url: "https://dapi.kakao.com/v2/local/search/keyword.json"
      auth_header: "Authorization: KakaoAK {key}"
    cache_file: "data/processed/geocode/cache.parquet"  # persistent query->coord cache
    flush_every: 200               # write-through the cache every N new lookups (rollover-safe)
    rate_limit_qps: 6              # pace VWorld/Kakao — bursts trigger server disconnects
    # subway station coords are a STATIC file downloaded once, not a live API
    station_coords_file: "data/reference/subway_stations.csv"

  # -- Applyhome (청약홈 분양정보) -- INFERENCE LIST ONLY, never trained on --
  applyhome:
    # invariant #3 (rev 2026-07-29): enriches BOTH train + infer with launch-time
    # fields only (분양가/입주예정/세대수/brand), joined when 공고일 <= deal_date.
    role: "enrichment"
    gateway: "api.odcloud.kr"      # odcloud; DECODED key. The data.go.kr ACCOUNT
    key_env: "APPLYHOME_API_KEY"   # key (MOLIT_API_KEY) also works — extractor falls back to it
    # SUBSCRPT_AREA_CODE_NM filter; data is 2020+
    region_names: ["서울", "경기", "인천", "부산", "대구", "대전", "광주", "울산", "세종", "제주"]
    format: "json"
    base_url: "https://api.odcloud.kr/api/ApplyhomeInfoDetailSvc/v1"
    operations:
      apt_detail: "getAPTLttotPblancDetail"   # announcement-level
      apt_model:  "getAPTLttotPblancMdl"       # per 주택형 -> 분양가 + 전용면적
      # other housing types (not primary scope):
      officetel_detail: "getUrbtyOfctlLttotPblancDetail"
      remainder_detail: "getRemndrLttotPblancDetail"
    request_params:
      page: "page"
      per_page: "perPage"          # max 1000
      # cond[...] filters (region / date) applied per pull
    join_key: "PBLANC_NO"          # detail <-> model join
    detail_fields:                 # verified live 2026-07-29
      announce_no: "PBLANC_NO"
      house_name: "HOUSE_NM"
      supply_region: "SUBSCRPT_AREA_CODE_NM"
      house_kind: "HOUSE_SECD_NM"     # APT filter
      address: "HSSPLY_ADRES"         # 공급위치 — geocodable 지번, often with parcel
      zip: "HSSPLY_ZIP"
      total_units: "TOT_SUPLY_HSHLDCO"
      builder: "CNSTRCT_ENTRPS_NM"    # 건설사 -> brand feature
      notice_date: "RCRIT_PBLANC_DE"  # 공고일 -> leakage guard (공고일 <= deal_date)
      move_in_ym: "MVN_PREARNGE_YM"   # 입주예정월 -> months_to_completion
      receipt_begin: "RCEPT_BGNDE"
      winner_announce: "PRZWNER_PRESNATN_DE"
    model_fields:                  # verified live 2026-07-29
      house_type: "HOUSE_TY"          # e.g. '055.9200A' -> 전용 55.92㎡ (parse leading number!)
      supply_area_m2: "SUPLY_AR"      # 공급면적 (NOT 전용) — kept for reference, NOT the join key
      supply_price: "LTTOT_TOP_AMOUNT"  # 분양가/공급금액, already in 만원 (sector unit)
      units: "SUPLY_HSHLDCO"          # 일반공급 세대수
    # exclusive_area_m2 is parsed from HOUSE_TY's leading number, never from SUPLY_AR.
    competition:                   # 청약접수 경쟁률 — demand FEATURE (invariant #3 rev):
      role: "feature"              # guarded by 청약일 <= deal_date (always true — subscription
      base_url: "https://api.odcloud.kr/api/ApplyhomeInfoCmpetRtSvc/v1"   # precedes resale)
      operation: "getAPTLttotPblancCmpet"   # PBLANC_NO x HOUSE_TY x 순위 x 거주지역
      raw_subdir: "applyhome_competition"
    gonggo:                        # 입주자모집공고문 PDF — regulatory-regime enrichment
      role: "enrichment"           # 전매제한/분양가상한제/실거주의무/규제지역 (fixed at 공고;
      #                              leakage-guarded 공고일 <= deal_date, same as other 청약홈)
      min_year: 2024               # summary-box format consistent 2024+ (verified 40-doc sample)
      detail_page: "https://www.applyhome.co.kr/ai/aia/selectAPTLttotPblancDetail.do"
      attach_base: "https://static.applyhome.co.kr/ai/aia/"   # PDF host; NO API key needed
      cache_dir: "data/raw/gonggo/pdf_cache"   # downloaded PDFs cached (idempotent re-runs)
      raw_subdir: "gonggo"
      # LH 신혼희망타운/공공분양 often publish image-only PDFs -> skipped, land null.

  # -- NEIS 학교기본정보 -- school locations for 학군/amenity features --
  neis:
    role: "amenity"                # static reference; geocoded then -> spatial features
    key_env: "NEIS_API_KEY"
    format: "json"
    base_url: "https://open.neis.go.kr/hub/schoolInfo"
    # 서울 경기 인천 부산 대구 대전 광주 울산 세종 교육청
    office_codes: ["B10", "J10", "E10", "C10", "D10", "G10", "F10", "H10", "I10", "T10"]
    page_size: 1000               # NEIS max pSize
    # NEIS gives 도로명주소 only (no lat/lon) -> geocode ORG_RDNMA via VWorld (ROAD)
    response_fields:
      school_code: "SD_SCHUL_CODE"
      name: "SCHUL_NM"
      school_type: "SCHUL_KND_SC_NM"   # 초등학교 / 중학교 / 고등학교 / ...
      foundation: "FOND_SC_NM"         # 공립 / 사립
      office: "ATPT_OFCDC_SC_NM"
      sido: "LCTN_SC_NM"
      road_address: "ORG_RDNMA"
      road_address_detail: "ORG_RDNDA"
      coedu: "COEDU_SC_NM"

  # -- 학교알리미 (schoolinfo) -- graduate outcomes -> 학군 quality features --
  schoolinfo:
    # apiType 51 = 졸업생 진로 현황: school TYPE (특목고/자사고) + 진학률(YEAR_GRAD_RATE).
    # Near-STATIC area attribute (school type stable) — API serves only last 3 yrs,
    # so NOT point-in-time for pre-2023 rows (documented limitation). Coords come by
    # joining SCHUL_NM to the already-geocoded NEIS schools, not a separate geocode.
    role: "quality"
    key_env: "SCHOOLINFO_API_KEY"
    format: "json"
    base_url: "http://www.schoolinfo.go.kr/openApi.do"
    api_type: "51"                 # 졸업생 진로 현황
    school_kind: "04"              # 04=고등학교 (진학률 near-100% for 중학교 -> useless)
    pblan_year: "2025"             # latest disclosed (API window = last 3 yrs only)
    # HS_KND_SC_NM values treated as academically selective (학군 signal):
    selective_hs_types: ["특수목적고등학교", "자율고등학교"]
    response_fields:
      school_code: "SCHUL_CODE"
      name: "SCHUL_NM"
      hs_type: "HS_KND_SC_NM"      # 일반고/특수목적고/자율고/특성화고
      grad_rate: "YEAR_GRAD_RATE"  # 진학률 (%)
      emd_code: "ADRCD_CD"         # 법정동 code (10-digit)

features:
  comp_radii_m: [500, 1000, 3000]
  comp_windows_days: [30, 60, 90]
  # dynamic radius expansion for sparse areas: 500m -> 1km -> 3km -> district
  dynamic_radius_expansion: true
  min_comps: 3
  macro_rate_delta_months: 6

split:
  # time-based only — never random shuffle
  val_fraction: 0.15
  test_fraction: 0.15

paths:
  data_root: "data"
  raw_dir: "data/raw"              # Hive-partitioned Parquet (year-month, region)
  feature_dir: "data/features"

# Cloud raw-data lake. The Airflow pipeline stages parquet locally (paths.raw_dir)
# then mirrors it to this GCS bucket via data_pipeline/warehouse/gcs.py:sync_to_gcs.
# Free-tier only (invariant #4). Credentials come from GOOGLE_APPLICATION_CREDENTIALS
# (service-account key path) — never a key value here. bucket is overridable by the
# GCS_BUCKET env var so deploys don't edit config.
# --- GCP cloud config (full GCP pivot) -----------------------------------------
# Credentials come from Application Default Credentials (google.auth.default() /
# GOOGLE_APPLICATION_CREDENTIALS) — never a key value here. IDs are env-overridable
# so deploys don't edit config: GCP_PROJECT_ID, GCS_BUCKET, BQ_DATASET.
gcp:
  project: ""                      # GCP_PROJECT_ID env overrides (blank = ADC default)
  region: "asia-northeast3"        # Seoul

gcs:
  bucket: ""                       # e.g. "korea-realestate-data"; or set GCS_BUCKET env
  raw_prefix: "raw"                # object prefix mirroring data/raw
  reference_prefix: "reference"    # static lookup files (法定동 codes, transit coords)

# BigQuery is the explicit contract boundary between the data and ML pillars.
# data_pipeline writes these tables; ml_pipeline reads them (never re-ingests).
bigquery:
  dataset: "korea_real_estate"     # BQ_DATASET env overrides
  location: "asia-northeast3"
  tables:
    molit_resale:    "molit_resale"       # training label (분양권+입주권 전매)
    molit_apt_trade: "molit_apt_trade"    # comps (아파트 매매)
    ecos_macro:      "ecos_macro"         # monthly macro
    applyhome:       "applyhome"          # launch-time enrichment
    commercial:      "commercial"         # commercial POI
    features:        "features"           # unified feature matrix (ML input)

vertex:
  pipeline_root: ""                # gs://<bucket>/pipeline-root; or set VERTEX_PIPELINE_ROOT env
  experiment: "presale_resale_price"
  model_display_name: "presale_resale"
  # candidate model families (LightGBM + XGBoost + scikit-learn all in scope)
  model_family: "lightgbm"         # lightgbm | xgboost | sklearn_hgb
